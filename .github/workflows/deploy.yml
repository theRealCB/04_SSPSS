name: Pubblica sito appunti

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # storia completa: serve per i badge 'Aggiornato'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material playwright
      - run: python build.py
      - run: python scripts/update_stats.py docs/assets/stats.json
        continue-on-error: true
      - run: mkdocs build
      - run: python make_pdfs.py
      - run: ghp-import -n -p -f -m "Deploy sito appunti" site
